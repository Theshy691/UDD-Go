services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      CARTO_API_KEY: ${CARTO_API_KEY:-}
      TOMTOM_TRAFFIC_KEY: ${TOMTOM_TRAFFIC_KEY:-}
      CHAT_OLLAMA_URL: ${CHAT_OLLAMA_URL:-http://help-model:11434}
      CHAT_OLLAMA_MODEL: ${CHAT_OLLAMA_MODEL:-qwen3:1.7b}
    restart: unless-stopped
  help-model:
    image: ollama/ollama:latest
    profiles: [chat]
    environment:
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_QUEUE: '4'
    volumes:
      - help-model:/root/.ollama
    restart: unless-stopped

volumes:
  help-model:
